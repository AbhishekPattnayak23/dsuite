{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white p-8 rounded shadow">
        <h2 class="text-2xl font-bold mb-6">Authentication</h2>
        <form id="auth-form">
            <input type="email" placeholder="Email" class="w-full p-3 border rounded mb-4" required>
            <input type="password" placeholder="Password" class="w-full p-3 border rounded mb-4" required>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
                Login
            </button>
        </form>
        <p class="mt-4 text-center">
            <a href="{{ url_for('dashboard') }}" class="text-blue-600">Admin Dashboard</a>
        </p>
    </div>
</div>
{% endblock %}
