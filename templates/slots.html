{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2>Available Slots</h2>
        <div class="mb-3">
            <input type="text" id="location" class="form-control" placeholder="Filter by location">
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Location</th>
                    <th>Date</th>
                    <th>Available</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="slotsTable"></tbody>
        </table>
    </div>
</div>
<script>
async function loadSlots() {
    const params = new URLSearchParams();
    if (location.value) params.set('location', location.value);
    const res = await fetch(`/api/slots?${params}`);
    const slots = await res.json();
    const tbody = document.getElementById('slotsTable');
    tbody.innerHTML = slots.map(s => `
        <tr>
            <td>${s.location}</td>
            <td>${s.date}</td>
            <td>${s.available}/${s.capacity}</td>
            <td>
                ${s.available > 0 ? `<button class="btn btn-sm btn-primary" onclick="bookSlot(${s.id})">Book</button>` : 'Full'}
            </td>
        </tr>
    `).join('');
}

async function bookSlot(id) {
    await fetch('/api/appointments', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({slot_id: id})
    });
    loadSlots();
}

location.addEventListener('input', loadSlots);
loadSlots();
</script>
{% endblock %}
