{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Admin Dashboard</h2>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5>Create New Slot</h5>
            </div>
            <div class="card-body">
                <form id="create-slot-form">
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <select id="location" class="form-select" required>
                            <option value="">Select location</option>
                            <option value="London">London</option>
                            <option value="Manchester">Manchester</option>
                            <option value="Birmingham">Birmingham</option>
                            <option value="Glasgow">Glasgow</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="start-time" class="form-label">Start Time</label>
                        <input type="time" id="start-time" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="end-time" class="form-label">End Time</label>
                        <input type="time" id="end-time" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Slot</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Admin JavaScript would go here
</script>
{% endblock %}
