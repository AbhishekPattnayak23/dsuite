<!DOCTYPE html>
<html>
<head>
    <title>Login - Passport Appointment System</title>
    <style>body{font-family:Arial;margin:40px;background:#f5f5f5}.container{background:white;padding:40px;border-radius:8px;max-width:400px;margin:0 auto}input{width:100%;padding:10px;margin:10px 0}button{width:100%;padding:10px;background:#2c3e50;color:white;border:none;border-radius:4px}</style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form action="/login" method="post">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p><a href="/"><- Back to Home</a></p>
    </div>
</body>
</html>
