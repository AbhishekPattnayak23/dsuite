{% extends 'base.html' %}
{% block title %}Login – Passport Portal{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <i class="bi bi-passport" style="font-size:3rem;color:var(--navy)"></i>
      <h4 class="mt-2 fw-bold" style="color:var(--navy)">Passport Appointment Portal</h4>
      <p class="text-muted small">Sign in to manage your appointment</p>
    </div>
    <div class="card">
      <div class="card-header"><i class="bi bi-lock"></i> Login</div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </form>
        <hr/>
        <p class="text-center mb-0 small">
          Don't have an account? <a href="{{ url_for('register') }}" class="fw-semibold">Register here</a>
        </p>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      <i class="bi bi-shield-lock"></i> Secure Government Portal
    </p>
  </div>
</div>
{% endblock %}
