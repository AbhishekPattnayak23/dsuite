{% extends 'base.html' %}
{% block title %}Register – Passport Portal{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-4">
      <i class="bi bi-person-plus" style="font-size:2.5rem;color:var(--navy)"></i>
      <h5 class="mt-2 fw-bold" style="color:var(--navy)">Create Your Account</h5>
    </div>
    <div class="card">
      <div class="card-header"><i class="bi bi-person-badge"></i> New User Registration</div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="As on passport application" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Mobile Number</label>
            <input type="text" name="mobile" class="form-control" placeholder="10-digit mobile" pattern="\d{10}" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" minlength="6" placeholder="Min 6 characters" required/>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required/>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-person-check"></i> Register
          </button>
        </form>
        <hr/>
        <p class="text-center mb-0 small">
          Already registered? <a href="{{ url_for('login') }}" class="fw-semibold">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
